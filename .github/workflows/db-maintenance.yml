name: MTN DB Maintenance

permissions:
  contents: read

on:
  schedule:
    - cron: '0 15 * * 0' # 매주 일요일 한국시간 0시 (UTC 15:00)
  workflow_dispatch:
    inputs:
      mode:
        description: Run a report only, or explicitly apply reviewed retention policies
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: Enter APPLY_RETENTION exactly when mode is apply
        required: false
        default: ''
        type: string

concurrency:
  group: mtn-db-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Report retention candidates (never deletes)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          set +x
          test -n "$DATABASE_URL"
          /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command \
            "begin; select pg_catalog.set_config('request.jwt.claim.role', 'service_role', true); select * from mtn_internal.apply_retention_policies(true, null); select * from mtn_internal.apply_recommendation_evidence_retention(true, null); commit;"

      - name: Reject an unconfirmed apply request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && inputs.confirmation != 'APPLY_RETENTION' }}
        run: |
          echo "Apply mode requires the exact confirmation phrase APPLY_RETENTION." >&2
          exit 1

      - name: Apply reviewed retention policies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && inputs.confirmation == 'APPLY_RETENTION' }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          MAINTENANCE_EVENT: ${{ github.event_name }}
          MAINTENANCE_MODE: ${{ inputs.mode }}
          RETENTION_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          set +x
          test -n "$DATABASE_URL"
          if [[ "$MAINTENANCE_EVENT" != "workflow_dispatch" || "$MAINTENANCE_MODE" != "apply" || "$RETENTION_CONFIRMATION" != "APPLY_RETENTION" ]]; then
            echo "Fail-closed: retention apply authorization did not match." >&2
            exit 1
          fi
          /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command \
            "begin; select pg_catalog.set_config('request.jwt.claim.role', 'service_role', true); select * from mtn_internal.apply_retention_policies(false, 'APPLY_RETENTION'); select * from mtn_internal.apply_recommendation_evidence_retention(false, 'APPLY_RETENTION'); commit;"

      - name: Reclaim physical database space
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && inputs.confirmation == 'APPLY_RETENTION' }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PGOPTIONS: -c lock_timeout=30000 -c statement_timeout=600000
        run: |
          set -euo pipefail
          set +x
          /usr/lib/postgresql/17/bin/vacuumdb --dbname="$DATABASE_URL" --full --analyze --table=public.daily_screener_candidates
          /usr/lib/postgresql/17/bin/vacuumdb --dbname="$DATABASE_URL" --full --analyze --table=public.recommendation_market_prices
          /usr/lib/postgresql/17/bin/vacuumdb --dbname="$DATABASE_URL" --full --analyze --table=public.recommendation_evidence_manifests

      - name: Refresh capacity evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && inputs.confirmation == 'APPLY_RETENTION' }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          set +x
          /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command \
            "select mtn_internal.capture_database_capacity();"
